<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket tree demo</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: auto; overflow: auto; background: var(--bg); color: var(--fg); font: 13px var(--font); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--hi); }
  p.lede { margin: 0 0 18px; color: var(--dim); }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .bar .log { color: var(--dim); font: 12px var(--font-mono); margin-left: 6px; min-height: 1.4em; }
  .stage { background: var(--chrome); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 8px; }
</style>
</head>
<body>
<main>
  <h1>Ticket tree</h1>
  <p class="lede">A simulated run on project GRASP: two agents claim, split, publish and finish. Nothing here talks to a server.</p>
  <div class="bar">
    <button class="btn" id="play">pause</button>
    <button class="btn" id="restart">restart</button>
    <button class="btn" id="speed">1×</button>
    <span class="log" id="log"></span>
  </div>
  <div class="stage" id="stage"></div>
</main>
<script type="module" src="tree-demo.js"></script>
</body>
</html>
