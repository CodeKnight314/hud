<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hud</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a class="brand" href="#board" title="hud"><img class="brand-mark" src="/mark.svg" alt=""><span>hud</span></a>
  <div id="board-switcher">
    <button id="btn-board" aria-haspopup="true" aria-expanded="false" title="switch workspace ([ and ])"><span id="board-name">workspace</span><span class="caret" aria-hidden="true">▾</span></button>
    <div id="board-menu" hidden></div>
  </div>
  <div id="view-toggle" role="tablist" aria-label="view">
    <button type="button" role="tab" data-view="list" aria-selected="false" title="Tasks: the live ticket tree (l)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="3.5" rx="1.2"/><rect x="1" y="11" width="5" height="3.5" rx="1.2"/><rect x="10" y="11" width="5" height="3.5" rx="1.2"/><path d="M8 5v3M3.5 11V8h9v3"/></svg><span>Tasks</span><span class="n"></span></button>
    <button type="button" role="tab" data-view="canvas" aria-selected="false" title="Monitors: charts and readings (l)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8.5h3.2l1.9-5 3.6 9.5 2-4.5H15"/></svg><span>Monitors</span><span class="n"></span></button>
  </div>
  <span class="spacer"></span>
  <div id="needs-wrap">
    <button id="btn-attention" aria-haspopup="true" aria-expanded="false" title="what is waiting on you (A)"><span class="needs-dot" aria-hidden="true"></span><span id="attention-count">0</span> need you</button>
    <div id="needs" role="dialog" aria-label="needs you" hidden></div>
  </div>
  <button id="btn-search" title="search everything (⌘/Ctrl+K)">search <kbd>⌘K</kbd></button>
  <span id="conn" class="off" title="live connection">○ offline</span>
  <div id="more-wrap">
    <button id="btn-more" aria-haspopup="true" aria-expanded="false" aria-label="more" title="more">⋯</button>
    <div id="more-menu" role="menu" hidden>
      <button id="btn-sessions" role="menuitem" title="live agent sessions">agents</button>
      <button id="btn-activity" role="menuitem" title="what changed, and who changed it">activity</button>
      <button id="btn-source" role="menuitem" title="where each monitor's numbers come from">sources</button>
      <button id="btn-organize" role="menuitem" title="lay the monitors out again (o)">organize monitors</button>
      <button id="btn-auto" role="menuitem" title="keep monitors laid out automatically (shift+o)">auto layout</button>
      <button id="btn-trash" role="menuitem" title="restore or purge deleted items">trash</button>
      <button id="btn-help" role="menuitem" title="shortcuts (?)">help</button>
    </div>
  </div>
</header>
<div id="persistence-banner" role="alert" hidden></div>

<aside id="sessions" hidden></aside>

<section id="global-search" aria-label="global search" hidden>
  <div class="search-head"><span>search</span><span class="sp"></span><button data-search-close aria-label="close search">×</button></div>
  <input id="global-search-input" type="search" placeholder="title, id, UUID, ident, body…" autocomplete="off" spellcheck="false">
  <div id="global-search-results"></div>
</section>

<main id="canvas">
  <div id="world"></div>
  <div id="marquee"></div>
</main>

<section id="list"></section>


<div id="empty">
  <div class="empty-card">
    <b>No monitors in this workspace</b>
    <p>Agents add them with <code>hud_create {type: "monitor"}</code> or <code>hud add monitor</code>.<br>Double-click to add one yourself, or press <kbd>m</kbd>.</p>
  </div>
</div>

<aside id="drawer" aria-label="inspector"></aside>
<aside id="program-inspector" aria-label="source inspector" hidden></aside>
<div id="drawer-grip" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0"></div>
<aside id="activity"><div class="phd"><span>activity</span><button data-close>×</button></div><div class="list"></div></aside>
<aside id="trash"><div class="phd"><span>trash</span><span class="sp"></span><button data-purge-all title="empty trash">empty</button><button data-close>×</button></div><div class="list"></div></aside>
<div id="menu"></div>
<div id="help"></div>
<div id="toast"></div>

<div id="canvas-ctl" aria-label="zoom">
  <button id="btn-fit" title="show every monitor (.)">fit</button>
  <button id="zoom-out" aria-label="Zoom out" title="zoom out (−)">−</button>
  <span id="zoom"></span>
  <button id="zoom-in" aria-label="Zoom in" title="zoom in (+)">+</button>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
