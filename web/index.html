<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='3' y='3' width='4' height='10' fill='%23fff'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <span class="brand">hud</span>
  <button id="btn-attention" title="cross-board attention inbox">attention <span class="nav-count" id="attention-count"></span></button>
  <button id="btn-runs" title="run overview">runs <span class="nav-count" id="runs-count"></span></button>
  <div id="board-switcher">
    <button id="btn-board" aria-haspopup="true" aria-expanded="false" title="switch board">board</button>
    <div id="board-menu" hidden></div>
  </div>
  <button id="btn-search" title="search everything (⌘/Ctrl+K)">search</button>
  <nav id="tabs"></nav>
  <span class="spacer"></span>
  <span id="who" title="actors active in the last 10 minutes"></span>
  <button id="btn-alerts" style="display:none"></button>
  <button id="btn-dashboard" title="monitors, notes and visual objects (l)">dashboard</button>
  <button id="btn-view" title="ticket list; click a row for details (l)">tickets</button>
  <details id="top-more"><summary>more</summary><div class="top-actions">
    <button id="btn-source" title="inspect the board's live metric sources and custom program bindings">source inspector</button>
    <button id="btn-organize" title="fit cards and groups into the fixed board (o)">organize board</button>
    <button id="btn-auto" title="keep this board organized automatically (shift+o)">auto</button>
    <button id="btn-trash" title="trash: restore or purge deleted items (T)">trash</button>
    <button id="btn-activity" title="activity feed (a)">activity</button>
    <button id="btn-help" title="help (?)">help / shortcuts</button>
  </div></details>
  <span id="conn" class="off" title="live connection">○ offline</span>
</header>

<section id="monitor-attention-strip" aria-label="monitor and comparison issues" aria-live="polite" hidden></section>

<section id="global-search" aria-label="global search" hidden>
  <div class="search-head"><span>search</span><span class="sp"></span><button data-search-close aria-label="close search">×</button></div>
  <input id="global-search-input" type="search" placeholder="title, id, UUID, ident, body…" autocomplete="off" spellcheck="false">
  <div id="global-search-results"></div>
</section>

<main id="canvas">
  <div id="world"></div>
  <div id="marquee"></div>
</main>

<section id="list"></section>

<section id="supervision" aria-live="polite">
  <div id="supervision-head"></div>
  <div id="supervision-body"></div>
</section>

<div id="empty">
  <pre>
<b>blank canvas</b>

double-click      add something here
t m n f w         ticket · monitor · note · frame · widget
:                 command line
?                 help

agents            hud_overview (MCP) · hud ls (CLI)</pre>
</div>

<aside id="drawer"></aside>
<aside id="program-inspector" aria-label="source inspector" hidden></aside>
<div id="drawer-grip" role="separator" aria-orientation="vertical" aria-label="Resize details sidebar" tabindex="0"></div>
<aside id="activity"><div class="phd"><span>activity</span><button data-close>×</button></div><div class="list"></div></aside>
<aside id="trash"><div class="phd"><span>trash</span><span class="sp"></span><button data-purge-all title="empty trash">empty</button><button data-close>×</button></div><div class="list"></div></aside>
<div id="menu"></div>
<div id="help"></div>
<div id="toast"></div>

<footer id="bar">
  <span id="mode">NORMAL</span>
  <span id="cmdwrap"><span>:</span><input id="cmd" spellcheck="false" autocomplete="off"></span>
  <span id="hint"></span>
  <span class="spacer"></span>
  <span id="pos"></span>
  <button id="btn-fit" title="show the whole board (.)">fit board</button>
  <button id="zoom-out" aria-label="Zoom out" title="zoom out to board limit (−)">−</button>
  <span id="zoom"></span>
  <button id="zoom-in" aria-label="Zoom in" title="zoom in (+)">+</button>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
