<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hud</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a class="brand" href="#board" title="board"><img class="brand-mark" src="/mark.svg" alt=""><span>hud</span></a>
  <button id="btn-search" title="search everything (⌘/Ctrl+K)">search</button>
  <span id="monitor-attention-strip" aria-label="monitor and comparison issues" aria-live="polite" hidden></span>
  <span class="spacer"></span>
  <span id="who" title="actors active in the last 10 minutes"></span>
  <button id="btn-sessions" title="live agent sessions">● 0 sessions</button>
  <button id="btn-alerts" style="display:none"></button>
  <span id="conn" class="off" title="live connection">○ offline</span>
</header>

<aside id="sessions" hidden></aside>

<aside id="rail" aria-label="workspace">
  <nav class="rail-nav">
    <button class="rail-item" id="btn-attention" title="cross-board attention inbox (A)">attention <span class="rail-count" id="attention-count"></span></button>
    <button class="rail-item" id="btn-runs" title="run overview (R)">runs <span class="rail-count" id="runs-count"></span></button>
  </nav>
  <div class="rail-boards">
    <div class="rail-heading"><span>boards</span><button id="btn-new-board" title="new board">+</button></div>
    <div id="board-list" role="listbox" aria-label="boards"></div>
  </div>
  <div class="rail-foot">
    <button id="btn-organize" title="fit cards and groups into the fixed board (o)">organize</button>
    <button id="btn-auto" title="keep this board organized automatically (shift+o)">auto</button>
    <button id="btn-source" title="inspect the board's live metric sources and custom program bindings">sources</button>
    <button id="btn-activity" title="activity feed">activity</button>
    <button id="btn-trash" title="trash: restore or purge deleted items">trash</button>
    <button id="btn-help" title="help / shortcuts (?)">help</button>
    <div id="board-switcher">
      <button id="btn-board" aria-haspopup="true" aria-expanded="false" title="board actions">board ▾</button>
      <div id="board-menu" hidden></div>
    </div>
  </div>
</aside>

<section id="global-search" aria-label="global search" hidden>
  <div class="search-head"><span>search</span><span class="sp"></span><button data-search-close aria-label="close search">×</button></div>
  <input id="global-search-input" type="search" placeholder="title, id, UUID, ident, body…" autocomplete="off" spellcheck="false">
  <div id="global-search-results"></div>
</section>

<main id="canvas">
  <div id="world"></div>
  <div id="marquee"></div>
</main>
<aside id="claim-widget" aria-label="claims and ready work" hidden></aside>

<section id="list"></section>

<section id="supervision" aria-live="polite">
  <div id="supervision-head"></div>
  <div id="supervision-body"></div>
</section>

<div id="empty">
  <pre>
<b>blank canvas</b>

double-click      add something here
t m n f w         ticket · monitor · note · frame · widget
:                 command line
?                 help

agents            hud_overview (MCP) · hud ls (CLI)</pre>
</div>

<aside id="drawer" aria-label="inspector"></aside>
<aside id="program-inspector" aria-label="source inspector" hidden></aside>
<div id="drawer-grip" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0"></div>
<aside id="activity"><div class="phd"><span>activity</span><button data-close>×</button></div><div class="list"></div></aside>
<aside id="trash"><div class="phd"><span>trash</span><span class="sp"></span><button data-purge-all title="empty trash">empty</button><button data-close>×</button></div><div class="list"></div></aside>
<div id="menu"></div>
<div id="help"></div>
<div id="toast"></div>

<footer id="bar">
  <span id="mode">NORMAL</span>
  <span id="cmdwrap"><span>:</span><input id="cmd" spellcheck="false" autocomplete="off"></span>
  <span id="hint"></span>
  <span class="spacer"></span>
  <span id="pos"></span>
  <button id="btn-view" title="ticket list (l)">tickets</button>
  <button id="btn-fit" title="show the whole board (.)">fit</button>
  <button id="zoom-out" aria-label="Zoom out" title="zoom out (−)">−</button>
  <span id="zoom"></span>
  <button id="zoom-in" aria-label="Zoom in" title="zoom in (+)">+</button>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
