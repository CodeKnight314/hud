# electron-builder packaging for hud.
#
# The app shell (appdir/main.mjs) goes into resources/app (asar is off); everything the node-mode server reads at runtime
# (the CLI bundle, web/ UI, guide, quickstart, probes, package.json) is copied loose under resources/hud/ so
# there is no asar in the server's file paths.
appId: local.hud.dashboard
productName: hud
copyright: hud
artifactName: hud-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build
  app: appdir

asar: false

# Unsigned macOS builds are ad-hoc signed in scripts/adhoc-sign.mjs so a download is not
# reported as damaged. With CSC_LINK or CSC_NAME, electron-builder signs a Developer ID,
# applies the hardened-runtime entitlements, and notarizes the app. scripts/notarize-dmg.mjs
# then notarizes the DMG. Windows Authenticode uses WIN_CSC_LINK. Secrets are listed in
# AGENTS.md; this repo does not contain certificates.
afterPack: scripts/adhoc-sign.mjs
afterAllArtifactBuild: scripts/notarize-dmg.mjs

extraResources:
  # electron-builder's app-dir copy drops the manifest; place it ourselves into the app dir
  - from: appdir/package.json
    to: app/package.json
  - from: bundle/hud.mjs
    to: hud/bin/hud.mjs
  - from: electron/render.mjs
    to: hud/electron/render.mjs
  - from: electron/settings-preload.cjs
    to: hud/electron/settings-preload.cjs
  - from: web
    to: hud/web
  - from: probes
    to: hud/probes
  - from: views
    to: hud/views
  - from: GUIDE.md
    to: hud/GUIDE.md
  - from: PLAYBOOKS.md
    to: hud/PLAYBOOKS.md
  - from: PRODUCT.md
    to: hud/PRODUCT.md
  - from: QUICKSTART.md
    to: hud/QUICKSTART.md
  - from: STYLE.md
    to: hud/STYLE.md
  - from: package.json
    to: hud/package.json
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/icon.png
    to: icon.png

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch: [arm64, x64]

dmg:
  # Signed when a Developer ID identity exists; otherwise electron-builder leaves the DMG unsigned.
  sign: true

win:
  icon: build/icon.png
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage
    - deb
