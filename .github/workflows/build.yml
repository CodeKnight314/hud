name: native builds

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check package versions against the stable tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/release-assets.mjs --check-version "$GITHUB_REF_NAME"
          else
            node scripts/release-assets.mjs --check-version
          fi

  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            args: --mac dmg --arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            args: --mac dmg --x64
          - runner: windows-2025
            platform: windows
            arch: x64
            args: --win nsis --x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build native installers
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/signing.mjs prepare --platform "${{ matrix.platform }}" --exec -- npm run dist -- --publish never --config.directories.output=dist/release ${{ matrix.args }}
      - name: Verify code signature
        run: node scripts/signing.mjs verify --platform "${{ matrix.platform }}" dist/release
      - name: Check packaged runtime
        run: node scripts/check-packaged.mjs dist/release ${{ matrix.arch }}
      - name: Normalize installer filenames
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, rename, stat } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const version = JSON.parse(await readFile('package.json', 'utf8')).version;
          const entries = await readdir('dist/release');
          const plans = process.env.PLATFORM === 'macos'
            ? [{ extension: '.dmg', suffix: `mac-${process.env.ARCH}.dmg` }]
            : process.env.PLATFORM === 'windows'
              ? [{ extension: '.exe', suffix: `win-${process.env.ARCH}.exe` }]
              : [
                  { extension: '.AppImage', suffix: 'linux-x86_64.AppImage' },
                  { extension: '.deb', suffix: 'linux-amd64.deb' },
                ];

          for (const { extension, suffix } of plans) {
            const matches = entries.filter((name) => name.endsWith(extension));
            if (matches.length !== 1) {
              throw new Error(`expected one ${extension} installer, found ${matches.length}`);
            }
            const source = resolve('dist/release', matches[0]);
            if (!(await stat(source)).isFile()) throw new Error(`${matches[0]} is not a regular file`);
            const target = resolve('dist/release', `hud-${version}-${suffix}`);
            if (source !== target) await rename(source, target);
          }
          NODE
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hud-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/release/*.dmg
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb
          if-no-files-found: error
          retention-days: 7

  # A version tag is the only release trigger. Branch pushes, including 0.2.0, and
  # workflow_dispatch upload build artifacts and stop. Do not publish from a merge.
  draft-release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: hud-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate installers and write checksums
        run: node scripts/release-assets.mjs release-assets "$GITHUB_REF_NAME"
      - name: Create GitHub draft release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --title "HUD $GITHUB_REF_NAME" --notes "macOS DMGs are Developer ID–signed and notarized, and the Windows installer is Authenticode-signed, when the signing secrets in AGENTS.md are configured. Otherwise these installers are unsigned; see the README and GUIDE for the first-launch difference. Review the assets before publishing." --generate-notes
