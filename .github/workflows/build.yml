name: cli release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hud-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check package versions against the stable tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/release-assets.mjs --check-version "$GITHUB_REF_NAME"
          else
            node scripts/release-assets.mjs --check-version
          fi

  test:
    name: test / ${{ matrix.os }}
    needs: version
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron's shared libraries (Linux UI check)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libgtk-3-0 libasound2t64
      - run: npm test

  cli:
    name: cli bundle
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the release tarball and checksums
        run: node scripts/pack-cli.mjs
      - name: Smoke-test the tarball as a user would
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          work=$(mktemp -d)
          tar -xzf "dist-cli/hud-$version.tar.gz" -C "$work"
          test -f "$work/hud.mjs"
          test -d "$work/web"
          node "$work/hud.mjs" version --json | grep -F "\"version\": \"$version\""
          node "$work/hud.mjs" --help > /dev/null
          HUD_HOME="$work/home" HUD_ASSET_DIR="$PWD/dist-cli" HUD_NO_PATH_HINT=1 sh dist-cli/install.sh
          "$work/home/bin/hud" version --json | grep -F "\"version\": \"$version\""
          test -x "$work/home/bin/hud"
      - name: Upload the CLI release assets
        uses: actions/upload-artifact@v4
        with:
          name: hud-cli
          path: dist-cli/*
          if-no-files-found: error
          retention-days: 7

  # A version tag is the only release trigger. Branch pushes and workflow_dispatch build the
  # tarball and stop. Do not publish from a merge.
  draft-release:
    name: Create draft release
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: hud-cli
          path: release-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the tarball, checksums and install scripts
        run: node scripts/release-assets.mjs release-assets "$GITHUB_REF_NAME"
      - name: Create GitHub draft release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --title "HUD $GITHUB_REF_NAME" --notes "hud is installed from a terminal: no app bundle and no code signing. The tarball is verified against SHA256SUMS by install.sh / install.ps1, and \`hud update\` fetches the next release the same way. Review the assets before publishing." --generate-notes
